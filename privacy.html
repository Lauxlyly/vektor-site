<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Privacy Policy — VEKTOR</title>
<meta name="description" content="VEKTOR Privacy Policy — GDPR-compliant. We collect as little personal data as possible: no accounts, no tracking cookies.">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{background:#0d0d14;color:#d1d5db;font-family:'Georgia','Times New Roman',serif;font-size:17px;line-height:1.75;max-width:760px;margin:0 auto;padding:44px 24px 90px;}
  nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:40px;padding-bottom:18px;border-bottom:1px solid #1f2937;font-family:'Courier New',monospace;font-size:13px;}
  .logo{color:#a78bfa;font-weight:700;letter-spacing:3px;text-decoration:none;}
  .nav-back{color:#94a3b8;text-decoration:none;}
  .nav-back:hover{color:#a78bfa;}
  #doc h1{font-size:clamp(26px,4vw,34px);color:#f3f4f6;line-height:1.2;margin:8px 0 18px;}
  #doc h2{font-size:21px;color:#f3f4f6;margin:36px 0 12px;border-bottom:1px solid #1f2937;padding-bottom:8px;line-height:1.3;}
  #doc h3{font-size:17px;color:#e5e7eb;margin:24px 0 8px;line-height:1.4;}
  #doc p,#doc li{margin-bottom:12px;}
  #doc ul,#doc ol{padding-left:24px;margin-bottom:14px;}
  #doc strong{color:#e5e7eb;}
  #doc a{color:#a78bfa;}
  #doc em{color:#a78bfa;font-style:normal;}
  #doc code{background:#111827;color:#c4b5fd;padding:2px 6px;border-radius:4px;font-size:14px;}
  #doc table{width:100%;border-collapse:collapse;margin:18px 0;font-size:15px;}
  #doc th{background:#111827;color:#c4b5fd;text-align:left;padding:9px 12px;border-bottom:2px solid #1f2937;font-family:'Courier New',monospace;font-size:12px;text-transform:uppercase;letter-spacing:.5px;}
  #doc td{padding:9px 12px;border-bottom:1px solid #1f2937;vertical-align:top;}
  #doc hr{border:none;border-top:1px solid #1f2937;margin:28px 0;}
  #doc blockquote{border-left:3px solid #7c3aed;background:#111827;padding:12px 18px;border-radius:0 8px 8px 0;margin:16px 0;color:#94a3b8;}
  .loading{color:#94a3b8;font-family:'Courier New',monospace;font-size:14px;}
  footer{margin-top:56px;padding-top:20px;border-top:1px solid #1f2937;font-size:13px;color:#94a3b8;font-family:'Courier New',monospace;}
  footer a{color:#a78bfa;}
</style>
</head>
<body>
<nav>
  <a href="index.html" class="logo">VEKTOR</a>
  <a href="index.html" class="nav-back">← Back to main</a>
</nav>
<div id="doc"><p class="loading">Loading Privacy Policy…</p></div>
<footer>VEKTOR · <a href="terms.html">Terms of Service</a> · <a href="index.html">Home</a> · GDPR-compliant</footer>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
  fetch('legal/PRIVACY.md').then(r=>{if(!r.ok)throw new Error(r.status);return r.text();})
    .then(md=>{document.getElementById('doc').innerHTML=marked.parse(md);document.title=(md.match(/^#\s+(.+)/m)||[])[1]||document.title;})
    .catch(()=>{document.getElementById('doc').innerHTML='<p class="loading">Could not load the Privacy Policy right now. Please <a href="index.html">return home</a> and try again.</p>';});
</script>
</body>
</html>
