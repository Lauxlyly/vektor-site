<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>VEKTOR — Orders</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#050507;color:#f5f3fb;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;padding:28px 20px 60px;}
.wrap{max-width:1100px;margin:0 auto;}
h1{font-family:ui-monospace,'SF Mono','Cascadia Code',Consolas,monospace;font-size:14px;font-weight:700;letter-spacing:4px;color:#cabdfa;margin-bottom:4px;}
.sub{font-size:12px;color:#948fa8;margin-bottom:24px;}

/* token gate */
#gate{max-width:420px;margin:80px auto;text-align:center;}
#gate p{color:#948fa8;font-size:13px;margin-bottom:16px;line-height:1.6;}
#gate input{width:100%;background:#211b3f;border:1.5px solid rgba(139,92,246,.5);border-radius:8px;padding:12px 14px;color:#f5f3fb;font-size:14px;font-family:ui-monospace,monospace;outline:none;margin-bottom:10px;}
#gate input:focus{border-color:#8b5cf6;}
#gate button{width:100%;background:linear-gradient(135deg,#8b5cf6,#5b3fd6);color:#fff;padding:12px;border-radius:8px;font-size:14px;font-weight:600;border:none;cursor:pointer;}
#gate .err{color:#f87171;font-size:12px;margin-top:10px;min-height:16px;}

/* main */
#main{display:none;}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px;flex-wrap:wrap;}
.toolbar button{background:#211b3f;border:1px solid rgba(139,92,246,.4);color:#cabdfa;padding:8px 16px;border-radius:7px;font-size:12px;cursor:pointer;}
.count{font-size:12px;color:#948fa8;font-family:ui-monospace,monospace;}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;padding:9px 10px;color:#948fa8;font-family:ui-monospace,monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;border-bottom:1px solid rgba(139,92,246,.2);white-space:nowrap;}
td{padding:9px 10px;border-bottom:1px solid #14101f;vertical-align:top;}
tr:hover td{background:#0e0c17;}
.mono{font-family:ui-monospace,'SF Mono',Consolas,monospace;font-size:11.5px;color:#948fa8;}
.pill{display:inline-block;font-family:ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.5px;padding:2px 8px;border-radius:100px;text-transform:uppercase;white-space:nowrap;}
.p-delivered{background:rgba(52,211,153,.14);color:#34d399;}
.p-generating{background:rgba(251,191,36,.12);color:#fbbf24;}
.p-failed{background:rgba(248,113,113,.14);color:#f87171;}
.p-unknown{background:rgba(148,143,168,.14);color:#948fa8;}
.verdict-pill{display:inline-block;font-family:ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.5px;padding:2px 8px;border-radius:100px;white-space:nowrap;}
.v-go{background:rgba(52,211,153,.16);color:#34d399;}
.v-rework{background:rgba(251,191,36,.14);color:#fbbf24;}
.v-stop{background:rgba(148,143,168,.12);color:#948fa8;}
.v-none{color:#5e5876;}
.err-text{color:#f87171;font-size:11.5px;max-width:260px;}
.strategy-toggle{color:#cabdfa;font-size:11px;cursor:pointer;text-decoration:underline;background:none;border:none;padding:0;font-family:inherit;}
.strategy-row{display:none;background:#0a0916;}
.strategy-row.show{display:table-row;}
.strategy-row td{white-space:pre-wrap;color:#c9c4dc;font-size:12px;line-height:1.6;padding:14px 10px;}
.empty{color:#948fa8;font-size:13px;padding:40px 0;text-align:center;}
tr.promising td{background:rgba(52,211,153,.04);}
.filter-btn{background:#211b3f;border:1px solid rgba(139,92,246,.4);color:#cabdfa;padding:8px 16px;border-radius:7px;font-size:12px;cursor:pointer;}
.filter-btn.active{background:rgba(52,211,153,.16);border-color:rgba(52,211,153,.5);color:#34d399;}
</style>
</head>
<body>
<div class="wrap">

  <div id="gate">
    <h1>VEKTOR</h1>
    <div class="sub">Order admin</div>
    <p>Paste the admin token (stored only for this browser tab session).</p>
    <input id="tokenInput" type="password" placeholder="ADMIN_TOKEN" autocomplete="off">
    <button onclick="tryToken()">Unlock</button>
    <div class="err" id="gateErr"></div>
  </div>

  <div id="main">
    <h1>VEKTOR</h1>
    <div class="sub">Order admin · last 50 orders, most recent first</div>
    <div class="toolbar">
      <span class="count" id="count"></span>
      <span style="flex:1"></span>
      <button class="filter-btn" id="promisingBtn" onclick="togglePromising()">★ Promising only (GO)</button>
      <button onclick="load()">↻ Refresh</button>
    </div>
    <div id="tableWrap"></div>
  </div>

</div>

<script>
const TOKEN_KEY = 'vektor_admin_token';

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtDate(iso) {
  if (!iso) return '—';
  try { return new Date(iso).toLocaleString('en-GB', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' }); }
  catch (_) { return iso; }
}
function pillClass(status) {
  if (status === 'delivered') return 'p-delivered';
  if (status === 'generating') return 'p-generating';
  if (status === 'failed') return 'p-failed';
  return 'p-unknown';
}
// GO_CONDITIONAL = "no obvious fatal flaw" — the ones worth the owner's own follow-up
// look. REWORK is a maybe; STOP/unknown are not flagged as promising.
function verdictInfo(v) {
  if (v === 'GO_CONDITIONAL') return { cls: 'v-go', label: 'GO — CONDITIONAL', promising: true };
  if (v === 'REWORK') return { cls: 'v-rework', label: 'REWORK', promising: false };
  if (v === 'STOP') return { cls: 'v-stop', label: 'STOP', promising: false };
  return { cls: 'v-none', label: v || '—', promising: false };
}

let _allOrders = [];
let _promisingOnly = false;
function togglePromising() {
  _promisingOnly = !_promisingOnly;
  document.getElementById('promisingBtn').classList.toggle('active', _promisingOnly);
  renderTable();
}

async function tryToken() {
  const token = document.getElementById('tokenInput').value.trim();
  const err = document.getElementById('gateErr');
  if (!token) { err.textContent = 'Paste a token first.'; return; }
  err.textContent = 'Checking…';
  try {
    const resp = await fetch('/api/admin/orders', { headers: { 'x-admin-token': token } });
    if (resp.status === 401) { err.textContent = 'Wrong token.'; return; }
    if (resp.status === 503) { err.textContent = 'ADMIN_TOKEN is not set on the server yet.'; return; }
    if (!resp.ok) { err.textContent = 'Request failed (' + resp.status + ').'; return; }
    const data = await resp.json();
    sessionStorage.setItem(TOKEN_KEY, token);
    document.getElementById('gate').style.display = 'none';
    document.getElementById('main').style.display = 'block';
    renderOrders(data.orders || []);
  } catch (e) {
    err.textContent = 'Network error.';
  }
}

async function load() {
  const token = sessionStorage.getItem(TOKEN_KEY);
  if (!token) { showGate(); return; }
  try {
    const resp = await fetch('/api/admin/orders', { headers: { 'x-admin-token': token } });
    if (resp.status === 401) { sessionStorage.removeItem(TOKEN_KEY); showGate('Session expired — re-enter the token.'); return; }
    if (!resp.ok) { document.getElementById('tableWrap').innerHTML = '<div class="empty">Request failed (' + resp.status + ').</div>'; return; }
    const data = await resp.json();
    renderOrders(data.orders || []);
  } catch (e) {
    document.getElementById('tableWrap').innerHTML = '<div class="empty">Network error.</div>';
  }
}

function showGate(msg) {
  document.getElementById('gate').style.display = 'block';
  document.getElementById('main').style.display = 'none';
  if (msg) document.getElementById('gateErr').textContent = msg;
}

function toggleStrategy(id) {
  const row = document.getElementById('strategy-' + id);
  if (row) row.classList.toggle('show');
}

function renderOrders(orders) {
  _allOrders = orders;
  renderTable();
}

function renderTable() {
  const all = _allOrders;
  const promisingCount = all.filter((o) => verdictInfo(o.verdict).promising).length;
  const orders = _promisingOnly ? all.filter((o) => verdictInfo(o.verdict).promising) : all;

  document.getElementById('count').textContent =
    orders.length + ' order' + (orders.length === 1 ? '' : 's') +
    (promisingCount ? ` · ${promisingCount} promising (GO)` : '');

  const wrap = document.getElementById('tableWrap');
  if (!orders.length) {
    wrap.innerHTML = '<div class="empty">' + (_promisingOnly ? 'No promising (GO_CONDITIONAL) strategies yet.' : 'No orders yet.') + '</div>';
    return;
  }

  const rows = orders.map((o, i) => {
    const id = 'row' + i;
    const vi = verdictInfo(o.verdict);
    const strategyBits = [];
    if (o.strategy) strategyBits.push('<b style="color:#cabdfa;">Strategy:</b><br>' + esc(o.strategy));
    if (o.report && o.report.bottom_line) strategyBits.push('<br><br><b style="color:#cabdfa;">Bottom line:</b><br>' + esc(o.report.bottom_line));
    if (o.report && o.report.edge_analysis) {
      const ea = o.report.edge_analysis;
      strategyBits.push('<br><br><b style="color:#cabdfa;">Edge source:</b> ' + esc(ea.edge_source || '—') + ' — ' + esc(ea.counterparty || ''));
    }
    return `
      <tr class="${vi.promising ? 'promising' : ''}">
        <td class="mono">${esc(fmtDate(o.created_at))}</td>
        <td class="mono" title="${esc(o.session_id)}">${esc((o.session_id||'').slice(0,18))}…</td>
        <td>${esc(o.email || '—')}</td>
        <td><span class="pill ${pillClass(o.status)}">${esc(o.status || 'unknown')}</span></td>
        <td><span class="verdict-pill ${vi.cls}">${vi.promising ? '★ ' : ''}${esc(vi.label)}</span></td>
        <td class="err-text">${esc(o.error || (o.email_sent_customer === false ? 'customer email not sent' : ''))}</td>
        <td><button class="strategy-toggle" onclick="toggleStrategy('${id}')">view</button></td>
      </tr>
      <tr class="strategy-row" id="strategy-${id}"><td colspan="7">${strategyBits.join('') || '(no strategy text stored)'}</td></tr>`;
  }).join('');

  wrap.innerHTML = `<table>
    <thead><tr>
      <th>Created</th><th>Session</th><th>Email</th><th>Status</th><th>Verdict</th><th>Error</th><th></th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

(function init() {
  if (sessionStorage.getItem(TOKEN_KEY)) {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('main').style.display = 'block';
    load();
  }
})();
</script>
</body>
</html>
